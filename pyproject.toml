[project]
name = "network-diagnostic-toolkit"
version = "1.0.0"
description = "Toolkit de diagnostico e inventario de rede, defensivo e restrito a alvos autorizados"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lucas Mesquita" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
